<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>杭州西站 · 建造过程（小样 hzwest-preview1）</title>
<style>
:root{--ink:#f4efe6;--ink2:rgba(244,239,230,.72);--ink3:rgba(244,239,230,.5);--glass:rgba(16,18,24,.42);--line:rgba(255,255,255,.16);--hot:#ffb36b;
--sans:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;--mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#20242c;color:var(--ink);font-family:var(--sans)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#view{position:fixed;inset:0;cursor:grab;touch-action:none}#view:active{cursor:grabbing}
.ui{position:fixed;z-index:2}
svg.i{width:14px;height:14px;display:block;fill:currentColor;flex:none}
/* 左上：标题 */
#hud{left:22px;top:18px;right:22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:16px}
#ttl{pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.45)}
#ttl h1{margin:0;font-size:24px;font-weight:700;letter-spacing:3px;line-height:1.1;white-space:nowrap}
#ttl .sub{font-size:12px;color:var(--ink2);margin-top:5px;letter-spacing:1px;white-space:nowrap}
/* 右上：3 个数 */
#nums{display:flex;gap:10px;pointer-events:none}
.num{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 14px 9px;min-width:0;white-space:nowrap}
.num .l{font-size:11px;color:var(--ink2);letter-spacing:1.5px}
.num .v{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.num .v small{font-size:12px;color:var(--ink2);font-weight:400;margin-left:4px;font-family:var(--sans)}
.num .v em{font-style:normal;font-size:13px;color:var(--ink2);font-weight:400;margin-left:8px}
/* 底栏：一行字幕 + 时间轴 */
#bar{left:22px;right:22px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
#cap{align-self:center;font-size:19px;font-weight:600;letter-spacing:2px;text-shadow:0 1px 10px rgba(0,0,0,.6);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#ctrl{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:7px 10px;user-select:none;-webkit-user-select:none}
.btn{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.btn:hover{background:rgba(255,255,255,.18)}.btn.on{border-color:var(--hot);color:var(--hot)}
#b-play{width:40px;height:40px;background:rgba(255,255,255,.92);color:#1b1d22;border:none}#b-play:hover{background:#fff}#b-play svg{width:16px;height:16px}
#track{position:relative;flex:1;min-width:120px;height:36px;cursor:pointer;touch-action:none}
#track .rail{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
#fill{position:absolute;left:0;right:0;top:12px;height:4px;transform-origin:0 0;will-change:transform;border-radius:2px;background:rgba(255,255,255,.75);pointer-events:none}
#slow{position:absolute;top:9px;height:10px;border-radius:5px;background:rgba(255,179,107,.28);border:1px solid rgba(255,179,107,.55);pointer-events:none}
#knob{position:absolute;left:0;top:6px;width:16px;height:16px;margin-left:-8px;will-change:transform;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,179,107,.55);pointer-events:none}
#track .mk{position:absolute;top:10px;width:1px;height:8px;background:rgba(255,255,255,.55);pointer-events:none}
#track .lab{position:absolute;top:22px;font-size:10.5px;color:var(--ink3);white-space:nowrap;pointer-events:none;line-height:1.2}
.chip{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}.chip.ok{color:#9fe0a8;border-color:rgba(159,224,168,.5)}.chip.ng{color:#ff8f8f}.chip.wait{color:var(--ink3)}
/* 次要信息面板 */
#info{display:none;position:fixed;z-index:3;right:22px;top:18px;bottom:88px;width:min(560px,calc(100% - 44px));flex-direction:column;background:rgba(18,20,26,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#info .hd{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}#info .hd h2{margin:0;font-size:15px;letter-spacing:2px}#info .hd .btn{margin-left:auto;width:30px;height:30px}
#info .bd{overflow-y:auto;padding:4px 16px 16px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
#info h3{font-size:12px;letter-spacing:2px;color:var(--ink);margin:14px 0 4px}
#info table{border-collapse:collapse;width:100%}#info td{padding:3px 6px 3px 0;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.07)}#info td:first-child{color:var(--ink);white-space:nowrap;padding-right:12px;width:1%}
#info td+td{font-family:var(--sans)}#info .ok{color:#9fe0a8}#info .ng{color:#ff8f8f}#info .sm{font-size:11.5px}
#info a{display:block;color:#ffcf9e;text-decoration:none;font-size:12px;padding:2px 0}#info a:hover{text-decoration:underline}
/* 矮窗口 / 窄窗口 */
body.short #ttl h1{font-size:19px}body.short #ttl .sub{font-size:11px;margin-top:3px}body.short #hud{top:12px}
body.short .num{padding:5px 11px 6px;border-radius:10px}body.short .num .v{font-size:18px}body.short .num .l{font-size:10px}
body.short #bar{bottom:10px;gap:5px}body.short #cap{font-size:16px}body.short #ctrl{padding:5px 8px}body.short #track{height:32px}body.short #track .lab{top:20px;font-size:10px}
body.short #info{top:12px;bottom:72px}
body.narrow .num .v em{display:none}body.narrow #ttl .sub{display:none}
body.nohud .ui{display:none!important}
@media (max-width:900px){#ttl h1{font-size:17px;letter-spacing:1px}.num{padding:5px 9px}.num .v{font-size:16px}#nums{gap:6px}#cap{font-size:15px;letter-spacing:1px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="view"></div>
<div id="hud" class="ui">
  <div id="ttl"><h1>杭州西站</h1><div class="sub">2019 – 2022 · 建造过程（规则推演）</div></div>
  <div id="nums">
    <div class="num"><div class="l">施工第</div><div class="v"><span id="n-day">0</span><small>天</small><em id="n-date">2019-09-17</em></div></div>
    <div class="num"><div class="l">屋盖高度</div><div class="v"><span id="n-h">—</span><small>m</small></div></div>
    <div class="num"><div class="l">钢结构已装</div><div class="v"><span id="n-s">0</span><small>t</small></div></div>
  </div>
</div>
<div id="bar" class="ui">
  <div id="cap"></div>
  <div id="ctrl">
    <button class="btn" id="b-play" aria-label="播放"></button>
    <div id="track"><div class="rail"></div><div id="slow"></div><div id="fill"></div><div id="knob"></div></div>
    <button class="btn" id="b-home" title="复位视角" aria-label="复位视角"><svg class="i" viewBox="0 0 14 14"><path d="M7 1.2 1 6.3h1.8V12.8h3.4V9h1.6v3.8h3.4V6.3H13z"/></svg></button>
    <button class="btn" id="b-info" title="说明 / 来源 / 自检" aria-label="说明"><svg class="i" viewBox="0 0 14 14"><path d="M7 .8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 7 .8zm.9 9.9H6.1V5.9h1.8zM7 4.9a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2z"/></svg></button>
  </div>
</div>
<div id="info" class="ui">
  <div class="hd"><h2>说明</h2><span class="chip wait" id="i-chip">自检中</span><button class="btn" id="i-x" aria-label="关闭"><svg class="i" viewBox="0 0 14 14"><path d="M2.6 1.2 7 5.6l4.4-4.4 1.4 1.4L8.4 7l4.4 4.4-1.4 1.4L7 8.4l-4.4 4.4-1.4-1.4L5.6 7 1.2 2.6z"/></svg></button></div>
  <div class="bd">
    <p>顺序不是手排的：每个构件按“压在谁上面（支承）、谁要先拆（临时设施）、提升时会不会碰（净空）”这几条规则推出先后，再按工程量估工期排程。拖动画面可旋转，<b>空格</b>播放 / 暂停，<b>← →</b>逐段。</p>
    <h3>规则自检</h3><div id="i-audit"></div>
    <h3>公开事实</h3><div id="i-facts"></div>
    <h3>推算假设</h3><div id="i-assume"></div>
    <h3>来源</h3><div id="i-src"></div>
  </div>
</div>
<script src="core/seq.js?v=6"></script>
<script src="fx.js?v=21"></script>
<script src="look.js?v=21"></script>
<script src="hzseq.js?v=1"></script>
<script src="hzview.js?v=1"></script>
</body>
</html>
